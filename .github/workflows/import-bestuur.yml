name: Import bestuur photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-bestuur.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize original board portraits
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image,ImageOps
          import requests
          base='https://tbreiningsrevuutje.be/wp-content/uploads/2019/03/'
          photos={
            'Alain-Lynneel':'alain-profiel.jpg',
            'Glenn-Dangreau':'breinings-revuutje-algemene-vergadering-201682016.jpg',
            'Peter-Boucquez':'peter-profiel.jpg',
            'Gerlinda-Lukacs':'breinings-revuutje-algemene-vergadering-201662016.jpg',
            'Etienne-Vercarre':'breinings-revuutje-algemene-vergadering-201652016.jpg',
            'Roger-Van-Looy':'breinings-revuutje-algemene-vergadering-201692016.jpg'
          }
          dest=Path('images/bestuur');dest.mkdir(parents=True,exist_ok=True)
          for name,source in photos.items():
              response=requests.get(base+source,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
              response.raise_for_status()
              img=ImageOps.exif_transpose(Image.open(BytesIO(response.content))).convert('RGB')
              img.thumbnail((650,900))
              img.save(dest/(name+'.webp'),'WEBP',quality=80,method=6)
              print('Imported',name)
          PY
      - name: Commit board photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/bestuur/
          if ! git diff --cached --quiet; then
            git commit -m "Import original board portraits"
            git push
          fi
