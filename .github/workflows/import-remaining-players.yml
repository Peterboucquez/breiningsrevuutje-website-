name: Import remaining player photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-remaining-players.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download portraits from original player page
        run: |
          python -m pip install --quiet pillow beautifulsoup4 requests
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          from PIL import Image,ImageOps
          from io import BytesIO
          from urllib.parse import urljoin
          url='https://tbreiningsrevuutje.be/index.php/onze-spelers/'
          html=requests.get(url,timeout=40).text
          soup=BeautifulSoup(html,'html.parser')
          names=['Glenn Dangreau','Etienne Vercarre',"Gerry d'Hooge",'Sylvie Inghelbrecht','Kurt Doornaert','Yoni Vandeputte','Nyncke','Thomas Boucquez','Frederic Duhoux','Nathalie Vanlandeghem','Yoeri Dewachter','Wendy Jonckheere','Eric Pira','Leen Corveleyn','Zoé Sterkendries','Joyce Vannecke','Olivier Lynneel','Megane Casier','Melanie Casier','Davida','Bart Casier','Ides Spitaels',"D'Hose Anita",'Marc Lefever','Bart Simoens']
          out=Path('images/spelers');out.mkdir(parents=True,exist_ok=True)
          found=0
          for name in names:
              img=soup.find('img',alt=lambda x:x and x.strip().lower()=='picture of '+name.lower())
              if not img:
                  print('MISSING image',name);continue
              src=img.get('data-src') or img.get('src')
              if not src:continue
              src=urljoin(url,src)
              try:
                  res=requests.get(src,timeout=35,headers={'User-Agent':'Mozilla/5.0'});res.raise_for_status()
                  im=ImageOps.exif_transpose(Image.open(BytesIO(res.content))).convert('RGB')
                  im.thumbnail((850,1200))
                  filename=re.sub(r'[^a-z0-9]+','-',name.lower()).strip('-')+'.webp'
                  im.save(out/filename,'WEBP',quality=78,method=6)
                  print('OK',name,filename,src);found+=1
              except Exception as exc:print('FAILED',name,exc)
          print('IMPORTED',found,'of',len(names))
          if found!=len(names):raise SystemExit('Some photos could not be imported')
          PY
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/spelers/
          if ! git diff --cached --quiet; then
            git commit -m "Add remaining player photos from original website"
            git push
          fi
