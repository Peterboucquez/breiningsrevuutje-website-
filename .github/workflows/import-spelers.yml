name: Import spelersfoto's
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-spelers.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize portraits
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps
          from io import BytesIO
          names = ['Fybe-Vansever','Natacha-Dangreau','Floor','Angeline-Brugge','Kiano-Dangreau','Erika-Desopper','DSC2742','DSC2726','Peter-Boucquez','Gerlinda-Lukacs','Emma-Bowe','Kenzo-Lynneel','Alain-Lynneel','Denolf-Els']
          out=Path('images/spelers');out.mkdir(parents=True,exist_ok=True)
          for name in names:
              url='https://tbreiningsrevuutje.be/wp-content/uploads/2026/11/'+name+'.jpg'
              try:
                  req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req,timeout=25) as r: data=r.read()
                  im=ImageOps.exif_transpose(Image.open(BytesIO(data))).convert('RGB')
                  im.thumbnail((850,1200))
                  im.save(out/(name+'.webp'),'WEBP',quality=78,method=6)
                  print('OK',name)
              except Exception as e:
                  print('FAILED',name,str(e))
          PY
      - name: Commit imported photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/spelers/
          if ! git diff --cached --quiet; then
            git commit -m "Import optimized player portraits into repository"
            git push
          fi
